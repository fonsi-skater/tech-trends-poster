name: Tech Trends Draft Poster (legacy manual backup)

# v2 runs as an always-on service (see PLAN.md / render.yaml) — scheduling
# moved in-process. This workflow is kept for MANUAL emergency use only
# (Actions tab -> Run workflow). Do not re-add `schedule:` triggers while
# the Render service is live: two pipelines would fight over topic history.

on:
  workflow_dispatch: {} # manual trigger only

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed so this job can commit the updated topic history back to the repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run draft generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/postDraft.js

      - name: Commit updated topic history
        run: |
          git config user.name "tech-trends-bot"
          git config user.email "actions@github.com"
          git add data/recent-topics.json
          git diff --staged --quiet || git commit -m "Update recent topics history [skip ci]"
          git push
