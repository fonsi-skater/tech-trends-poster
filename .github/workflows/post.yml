name: Tech Trends Draft Poster

on:
  schedule:
    # Times are in UTC. Kenya is UTC+3, so subtract 3 hours from EAT to get UTC.
    # These run at 06:00, 14:00, 22:00 EAT (Nairobi time) — spread across
    # the 6am-10pm window.
    - cron: "0 3 * * *"   # 06:00 EAT
    - cron: "0 11 * * *"  # 14:00 EAT
    - cron: "0 19 * * *"  # 22:00 EAT
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run draft generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/postDraft.js
